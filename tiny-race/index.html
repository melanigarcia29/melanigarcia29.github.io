<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tinny race</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
</head>
<body>
    <h1>tiny-race</h1>
    <div class="controls">
        <label for="position">Position (pixels):</label>
        <input id="position" type="number" min="0" max="560" value="30">
        <button id="set-racer">Set Racer 1 position</button>
        <button id="add-racer">Add racer</button>
        <button id="remove-racer">Remove last racer</button>
    </div>
    <p id="race-status" aria-live="polite"></p>
    <script src="sketch.js"></script>
</body>
</html>
